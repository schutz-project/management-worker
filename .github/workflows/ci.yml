name: Management Worker CI

on:
  push:
    branches:
      - main
      - "setup/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-check:
    name: Docker build and import check
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Check HTTP and HTTPS release health
        run: python3 tests/test_release_health.py

      - name: Validate deployment Compose metadata
        run: python3 tests/test_release_compose.py

      - name: Build Worker image
        run: docker build -t schutz-management-worker:ci .

      - name: Check Worker imports
        run: >
          docker run --rm --network none
          schutz-management-worker:ci
          python -c "import management.worker; print('Worker import OK')"

      - name: AI deadline regression tests
        run: |
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/tests:/tmp/worker-tests:ro" \
            schutz-management-worker:ci \
            python -m unittest discover -s /tmp/worker-tests -p test_ai_deadline.py -v

      - name: Prometheus alert integration tests
        run: |
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/tests:/tmp/worker-tests:ro" \
            schutz-management-worker:ci \
            python -m unittest discover -s /tmp/worker-tests -p test_prometheus_alerts.py -v

      - name: AI scrape observation scope tests
        run: |
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/tests:/tmp/worker-tests:ro" \
            schutz-management-worker:ci \
            python -m unittest discover -s /tmp/worker-tests -p test_scrape_scope.py -v

      - name: Historical incident context tests
        run: |
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/tests:/tmp/worker-tests:ro" \
            schutz-management-worker:ci \
            python -m unittest discover -s /tmp/worker-tests -p test_history.py -v

  publish-ecr:
    name: Publish image to ECR
    needs: [docker-check]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    env:
      AWS_REGION: ap-northeast-2
      REGISTRY: 527673188566.dkr.ecr.ap-northeast-2.amazonaws.com
      ECR_REPOSITORY: schutz/management-worker
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::527673188566:role/schutz-github-deploy-role
          aws-region: ap-northeast-2

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build and push image
        id: image
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --platform linux/amd64 \
            -f Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Published: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
